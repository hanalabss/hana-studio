[pytest]
# 저장소 루트에서 `python -m pytest` 만 치면 tests/ 아래만 모은다(scripts/, dist/ 등은 보지 않는다).
testpaths = tests
# 프로젝트 패키지(design, data, printer, services, ui, utils)를 어디서 실행하든 임포트할 수 있게 한다.
pythonpath = .
# 테스트 폴더에는 __init__.py가 없고 기본 임포트 방식(prepend)을 쓴다. 이 방식에서는 테스트 파일과
# 도우미 모듈의 이름이 저장소 전체에서 하나뿐이어야 하므로 이름에 폴더를 넣는다:
#   tests/<폴더>/test_<폴더>_*.py, tests/<폴더>/<폴더>_helpers.py  (예: tests/printer/printer_helpers.py)
# 같은 이름이 생기면 pytest가 "import file mismatch" 오류로 바로 알려 준다.
addopts = --import-mode=prepend
